name: Build Android APK

on:
  push:
    branches: [ "claude/create-agents-3cBdh" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Build Next.js static export
      working-directory: frontend
      env:
        NEXT_PUBLIC_BACKEND_URL: http://10.0.2.2:3001
      run: npm run build
    
    - name: Sync Capacitor
      working-directory: frontend
      run: npx cap sync android
    
    - name: Make gradlew executable
      working-directory: frontend/android
      run: chmod +x gradlew
    
    - name: Build debug APK
      working-directory: frontend/android
      run: ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: revorus-escrow-debug
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        name: Revorus Escrow v${{ github.run_number }}
