name: Revorus Escrow CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: revorus_escrow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ./backend/package-lock.json

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run Prisma generate
      run: npx prisma generate
      env:
        DATABASE_URL: postgresql://root:rootpassword@localhost:5432/revorus_escrow_test

    - name: Run ESLint
      run: npm run lint
      continue-on-error: true # Allow lint errors to pass in CI for now to prioritize build

    - name: Build
      run: npm run build
      env:
        DATABASE_URL: postgresql://root:rootpassword@localhost:5432/revorus_escrow_test

  build_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install dependencies
      run: npm ci || npm install

    - name: Format Check / Lint
      run: npm run lint
      continue-on-error: true

    - name: Build Next.js
      run: npm run build

