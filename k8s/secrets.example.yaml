apiVersion: v1
kind: Secret
metadata: { name: revorus-escrow-secrets }
type: Opaque
stringData:
  POSTGRES_USER: replace-me
  POSTGRES_PASSWORD: replace-with-a-random-password
  POSTGRES_DB: revorus_escrow
  DATABASE_URL: postgresql://replace-me:replace-me@revorus-postgres-svc:5432/revorus_escrow?schema=public
  JWT_SECRET: replace-with-at-least-32-random-characters
  BANK_WEBHOOK_SECRET: replace-with-at-least-32-random-characters
  REDIS_PASSWORD: replace-with-a-random-password
  RABBITMQ_URL: amqp://replace-me:replace-me@revorus-rabbitmq-svc:5672
