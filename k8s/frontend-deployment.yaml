apiVersion: apps/v1
kind: Deployment
metadata:
  name: revorus-escrow-frontend
  labels:
    app: revorus-escrow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revorus-escrow-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: revorus-escrow-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/anuar4241/revorus-frontend:replace-with-commit-sha
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "/api"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: revorus-escrow-frontend-svc
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: revorus-escrow-frontend
