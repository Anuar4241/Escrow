apiVersion: apps/v1
kind: Deployment
metadata:
  name: revorus-escrow-backend
  labels:
    app: revorus-escrow-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: revorus-escrow-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: revorus-escrow-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/anuar4241/revorus-backend:replace-with-commit-sha
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: revorus-escrow-config
        - secretRef:
            name: revorus-escrow-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: revorus-escrow-backend-svc
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: revorus-escrow-backend
