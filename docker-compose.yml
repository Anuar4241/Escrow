version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: revorus-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: revorus_escrow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d revorus_escrow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revorus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: revorus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: rootpassword
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    image: anuarbakhitkhanov1357/revorus-backend:latest
    container_name: revorus-backend
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://root:rootpassword@postgres:5432/revorus_escrow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://root:rootpassword@rabbitmq:5672
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  frontend:
    image: anuarbakhitkhanov1357/revorus-frontend:latest
    container_name: revorus-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

